
name: Build TechVibe Invoice APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TechVibeInvoiceAndroid_Source.zip'
      - '.github/workflows/build-techvibe-invoice-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: unzip -q TechVibeInvoiceAndroid_Source.zip -d extracted

      - name: Build APK
        working-directory: extracted/invoice-android
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TechVibe-Invoice-APK
          path: extracted/invoice-android/app/build/outputs/apk/debug/app-debug.apk
